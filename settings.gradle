pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'eclipse-parent'

// NOTE: the stale root client-mod-gradle tree was archived to archive/client-mod-gradle.
// The live client lives in fabric-server/client-mod-gradle (see fabric-server/settings.gradle).

include 'server'
project(':server').projectDir = file('fabric-server/server')
