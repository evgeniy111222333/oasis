plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

version = project.mod_version
group = project.maven_group

// Single source of truth for code shared with the server module. Added to the client's main
// (common environment) source set only — never to the client-only source set.
def commonSources = rootProject.file('common/src/main/java')
sourceSets.main.java.srcDirs += commonSources

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"eclipseclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Local MCEF Mod Dependency
	implementation files('libs/mcef_fabric_2.2.0_MC_26.1.1.jar')
}

// Opt-in real-client TAB regression tests. Isolated world and run directory; never packaged.
// ./gradlew :client:runClientGameTest -PtabGameTest
if (providers.gradleProperty("tabGameTest").isPresent()) {
	dependencies {
		runtimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "eclipse-tab-tests"
			enableGameTests = false
			enableClientGameTests = true
			eula = true
		}
	}
	sourceSets.gametest.compileClasspath += sourceSets.client.output
	sourceSets.gametest.runtimeClasspath += sourceSets.client.output
}

processResources {
	// Superseded TAB concept stays in the workspace, but is not part of the shipped client.
	exclude "assets/eclipseclient/textures/gui/rp_tab_eclipse_observatory.png"
	exclude "assets/eclipseclient/textures/gui/rp_hud_eclipse_navigator.png"
	// TAB uses its own antialiased text cache; retain the OFL font file without allocating a second glyph atlas.
	exclude "assets/eclipseclient/font/tab_serif.json"
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Item names and client UI translations now share the canonical main resource pack.
// Retain the legacy sources, but package each language path only once.
sourceSets.client.resources.exclude "assets/eclipseclient/lang/**"

