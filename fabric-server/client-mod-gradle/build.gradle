tasks.register("verifyMicrovoxelCrackOverlay") {
	group = "verification"
	description = "Checks the per-cell mining crack overlay wiring (state, sprite emission, geometry key)."
	def section = layout.projectDirectory.file(
			"src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelSectionModel.java")
	def state = layout.projectDirectory.file(
			"src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelClientState.java")
	def cracks = layout.projectDirectory.file(
			"src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelClientCracks.java")
	def provider = layout.projectDirectory.file(
			"src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelGeometryProvider.java")
	inputs.files(section, state, cracks, provider)
	doLast {
		def sectionText = section.asFile.getText("UTF-8")
		assert sectionText.contains("emitCrackCube")
				&& sectionText.contains("destroy_stage_")
				&& sectionText.contains("crackRevisionOf")
				&& sectionText.contains("CRACK_INFLATE"):
				"The section model must emit the destroy-stage crack with a crack geometry key"
		def stateText = state.asFile.getText("UTF-8")
		assert stateText.contains("applyMineStage")
				&& stateText.contains("crackRevisionOf")
				&& stateText.contains("pruneCracks")
				&& stateText.contains("clearCracks"):
				"Client crack state and clearing must be present"
		assert cracks.asFile.getText("UTF-8").contains("rpchat.microvoxel.crackOverlay"):
				"The crack overlay kill-switch must live in the extracted crack state"
		def providerText = provider.asFile.getText("UTF-8")
		assert providerText.contains("int crackRevisionOf(BlockPos position)"):
				"The geometry provider must expose the crack revision in its contract"
	}
}

tasks.register("verifyMicrovoxelOcclusionRefresh") {
	group = "verification"
	description = "Checks that real-block changes re-mesh adjacent microvoxel volumes (stale-occlusion fix)."
	def mixin = layout.projectDirectory.file(
			"src/client/java/ua/rp/chat/client/mixin/microvoxel/ClientLevelFxMixin.java")
	def state = layout.projectDirectory.file(
			"src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelClientState.java")
	inputs.files(mixin, state)
	doLast {
		def mixinText = mixin.asFile.getText("UTF-8")
		assert mixinText.contains("setServerVerifiedBlockState(Lnet/minecraft/core/BlockPos;")
				&& mixinText.contains("setBlock(Lnet/minecraft/core/BlockPos;")
				&& mixinText.contains("onRealBlockChanged(pos)")
				&& mixinText.count('at = @At("RETURN")') >= 2:
				"Real-block changes must invalidate microvoxel occlusion on both update paths"
		def stateText = state.asFile.getText("UTF-8")
		assert stateText.contains("public static void onRealBlockChanged(BlockPos")
				&& stateText.count("queueRebuild(immutable.offset(") == 6:
				"onRealBlockChanged must re-mesh exactly the six axis neighbours"
	}
}

tasks.register("verifyRadialMenuWiring") {
	group = "verification"
	description = "Checks the radial menu: live palette handshake, honest brush panel, no demo data, charging paste."
	def radial = layout.projectDirectory.file(
			"src/client/resources/assets/eclipseclient/web/radial/radial.html")
	def radialScreen = layout.projectDirectory.file(
			"src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelRadialScreen.java")
	def controller = layout.projectDirectory.file(
			"src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelInteractionController.java")
	def paletteClient = layout.projectDirectory.file(
			"src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelMaterialPaletteClient.java")
	def carverScreen = layout.projectDirectory.file(
			"src/client/java/ua/rp/chat/client/carver/CarverDesignScreen.java")
	def editEngine = layout.projectDirectory.file(
			"../server/src/main/java/ua/rp/chat/microvoxel/edit/MicrovoxelEditEngine.java")
	inputs.files(radial, radialScreen, controller, paletteClient, carverScreen, editEngine)
	doLast {
		def html = radial.asFile.getText("UTF-8")
		assert html.contains("const MATERIALS = [];"):
				"The radial must ship no demo palette; it is filled only by setMaterials"
		assert !html.contains("дубовая доска") && !html.contains("brush.line") && !html.contains("dataset.shapeId"):
				"Demo material names / dead shape plumbing must be gone"
		assert html.contains("palette-ready"):
				"The page must acknowledge the palette handshake"
		assert html.contains("brush.apply") && html.contains("BRUSHES"):
				"The brush must be a real panel with shape + radius"
		assert html.contains("if (hotOuter === -1) return;"):
				"A hub click must be a safe no-op (no SECTORS[-1] TypeError)"
		assert html.contains("{ id: \"erase\"") && html.contains("{ id: \"place\"")
				&& html.contains("{ id: \"material\"") && html.contains("{ id: \"history\"")
				&& !html.contains("{ id: \"clip\"") && !html.contains("{ id: \"gen\"")
				&& !html.contains("{ id: \"brush\"") && !html.contains("{ id: \"shape\""):
				"The wheel is carver-only: Убрать / Поставить / Материал / История"
		assert html.contains("dynamic: \"materials\", action: \"place\""):
				"«Поставить» must fan out the palette and emit action \"place\", not dead-end"
		assert html.contains("parent.action || \"material\""):
				"A material folder must re-label its pick (place vs material)"
		assert html.contains("const inGame = hashTokens.includes(\"ingame\")")
				&& html.contains("if (!inGame)"):
				"Prototype entry points (Tab shortcut, dev button) must be disabled in the embedded overlay"

		def screen = radialScreen.asFile.getText("UTF-8")
		assert screen.contains("palette-ready") && screen.contains("MAX_PALETTE_ATTEMPTS")
				&& screen.contains("paletteReady"):
				"The overlay must retry setMaterials until the page acks"
		assert screen.contains("volatile MicrovoxelRadialScreen current")
				&& screen.contains("MicrovoxelRadialScreen active = current")
				&& screen.contains("if (current == this) current = null"):
				"The reused browser must dispatch console events to the live wheel instance, otherwise a pick never closes the overlay (stale-handler regression)"

		def palette = paletteClient.asFile.getText("UTF-8")
		assert palette.contains("colorHex") && palette.contains("getMapColor")
				&& palette.contains("\\\"color\\\""):
				"The palette JSON must carry a per-material swatch colour"

		def controllerText = controller.asFile.getText("UTF-8")
		assert controllerText.contains("case \"erase\"") && controllerText.contains("case \"place\"")
				&& controllerText.contains("case \"material\"")
				&& controllerText.contains("setPlacing") && controllerText.contains("setPlaceMaterial")
				&& controllerText.contains("history.undo"):
				"The radial must map modes, material and history onto the Carver draft"
		assert controllerText.contains("setPlaceMaterial(material)"):
				"«Поставить» must apply the material picked in its sub-ring"
		assert !controllerText.contains("attackAt") && !controllerText.contains("performErase")
				&& !controllerText.contains("cycleShape") && !controllerText.contains("performPlace"):
				"The microvoxel editor must be gone: no direct voxel edits, no dead paths"

		def carver = carverScreen.asFile.getText("UTF-8")
		assert carver.contains("sendPlaceStroke") && carver.contains("sendPlaceBox")
				&& carver.contains("boxDragging") && carver.contains("isShiftDown()"):
				"Carver LMB must paint the draft; Shift+drag marks a box"
		assert !carver.contains("panelLeft") && !carver.contains("toolButton"):
				"The Carver sidebar panel must be gone (radial owns every tool)"

		def protocol = layout.projectDirectory.file(
				"../common/src/main/java/ua/rp/chat/carver/CarverProtocol.java")
		assert protocol.asFile.getText("UTF-8").contains("ACTION_STROKE_PLACE")
				&& protocol.asFile.getText("UTF-8").contains("encodeDraftState"):
				"The protocol must carry the additive draft"

		def sessionFile = layout.projectDirectory.file(
				"../server/src/main/java/ua/rp/chat/carver/DraftSession.java")
		assert sessionFile.asFile.getText("UTF-8").contains("markPlace")
				&& sessionFile.asFile.getText("UTF-8").contains("placeMask"):
				"The server draft must own the additive mask"

		def engine = editEngine.asFile.getText("UTF-8")
		assert engine.contains("boolean creative = player.gameMode.getGameModeForPlayer() == GameType.CREATIVE;")
				&& engine.contains("materialUnits.merge")
				&& engine.contains("volume.setShape(cell, source.shapeAt(sourceCell));"):
				"Paste must charge material in survival and preserve shapes"
	}
}

tasks.register("verifyMcefGlStateGuard") {
	group = "verification"
	description = "Checks MCEF's leaked GL state is reset everywhere a browser can paint."
	def guard = layout.projectDirectory.file(
			"src/client/java/ua/rp/chat/client/mcef/McefGlStateGuard.java")
	def guiMixin = layout.projectDirectory.file(
			"src/client/java/ua/rp/chat/client/mixin/render/GuiMixin.java")
	def screens = [
			layout.projectDirectory.file("src/client/java/ua/rp/chat/client/AuthScreen.java"),
			layout.projectDirectory.file("src/client/java/ua/rp/chat/client/BodyStatusScreen.java"),
			layout.projectDirectory.file("src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelRadialScreen.java")
	]
	inputs.files(guard, guiMixin)
	inputs.files(screens)
	doLast {
		def guardText = guard.asFile.getText("UTF-8")
		assert guardText.contains("GL_UNPACK_ROW_LENGTH")
				&& guardText.contains("GL_UNPACK_SKIP_ROWS")
				&& guardText.contains("GL_UNPACK_SKIP_PIXELS")
				&& guardText.contains("_pixelStore")
				&& guardText.contains("_bindTexture(0)")
				&& guardText.contains("isOnRenderThread"):
				"The guard must reset the unpack stride and texture bindings MCEF leaves behind"
		def guiText = guiMixin.asFile.getText("UTF-8")
		assert guiText.contains("extractRenderState(Lnet/minecraft/client/gui/GuiGraphicsExtractor;Lnet/minecraft/client/DeltaTracker;)V")
				&& guiText.contains("McefGlStateGuard.restore()"):
				"The GUI hook must restore the GL baseline every frame before the GUI pass is built"
		screens.each { screen ->
			def text = screen.asFile.getText("UTF-8")
			assert text.contains("McefGlStateGuard.onBrowserActive()")
					&& text.contains("McefGlStateGuard.restore()"):
					"${screen.asFile.name} must mark the browser active and restore the GL baseline"
		}
	}
}

