tasks.register("verifyBloodFxAssets") {
	group = "verification"
	description = "Checks every Blood FX sprite and particle atlas declaration."
	def bloodTextures = layout.projectDirectory.dir(
			"src/main/resources/assets/eclipseclient/textures/particle/blood")
	def particleDefs = layout.projectDirectory.dir(
			"src/main/resources/assets/eclipseclient/particles")
	inputs.dir(bloodTextures)
	inputs.dir(particleDefs)
	doLast {
		def expected = (0..4).collect { "drop_${it}.png" }
		expected += (0..7).collect { "splat_${it}.png" }
		expected += (0..4).collect { "wound_${it}.png" }
		expected.each { name ->
			def file = bloodTextures.file(name).asFile
			assert file.isFile(): "Missing Blood FX sprite: ${name}"
			def image = javax.imageio.ImageIO.read(file)
			assert image != null && image.width == 32 && image.height == 32:
					"Blood FX sprite must be a valid 32x32 PNG: ${name}"
			assert image.colorModel.hasAlpha(): "Blood FX sprite requires transparency: ${name}"
			assert ((image.getRGB(0, 0) >>> 24) & 0xff) == 0:
					"Blood FX sprite corner must be transparent: ${name}"
			def visible = 0
			for (int y = 0; y < image.height; y++) {
				for (int x = 0; x < image.width; x++) {
					if (((image.getRGB(x, y) >>> 24) & 0xff) > 24) visible++
				}
			}
			assert visible >= 3 && visible <= 800:
					"Blood FX sprite has invalid visible coverage: ${name} (${visible})"
		}
		["blood_drop.json", "blood_decal.json", "blood_wound.json"].each { name ->
			def file = particleDefs.file(name).asFile
			assert file.isFile(): "Missing Blood FX particle definition: ${name}"
			def json = new JsonSlurper().parse(file)
			assert json.textures && !json.textures.isEmpty(): "Empty Blood FX particle atlas: ${name}"
		}
		println "Blood FX assets: 18 transparent sprites and 3 atlases are valid"
	}
}


