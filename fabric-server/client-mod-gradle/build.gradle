tasks.register("verifyMixinSignatures") {
	group = "verification"
	description = "Fails when an @Inject handler lacks its trailing CallbackInfo parameter."
	def mixinDir = layout.projectDirectory.dir("src/client/java/ua/rp/chat/client/mixin")
	inputs.dir(mixinDir)
	doLast {
		def bad = []
		mixinDir.asFile.eachFileRecurse { file ->
			if (!file.name.endsWith("Mixin.java")) return
			def text = file.getText("UTF-8")
			def matcher = text =~ /@Inject\([^)]*\)\s*\n\s*private void (eclipse\$\w+)\(([^)]*)\)\s*\{/
			while (matcher.find()) {
				String name = matcher.group(1)
				String params = matcher.group(2).trim()
				String last = params.isEmpty() ? "" : params.split(",")[-1].trim()
				if (!(last.contains("CallbackInfo"))) {
					bad.add("${file.name}:${name}".toString())
				}
			}
		}
		assert bad.isEmpty():
				"Mixin handlers without trailing CallbackInfo (game would crash at startup): ${bad}"
	}
}


