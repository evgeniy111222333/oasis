<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#15120f"/><stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      .title{font:700 28px 'Segoe UI',sans-serif;fill:#fff7e9;letter-spacing:1px}.sub{font:18px 'Segoe UI',sans-serif;fill:#b7aa9b}.tag{font:700 18px 'Segoe UI',sans-serif;fill:#e3c099;letter-spacing:2px}.ui{font:700 22px monospace;fill:#fff7e9}.action{font:600 16px monospace;fill:#c5af8e;letter-spacing:1px}.small{font:16px 'Segoe UI',sans-serif;fill:#d1c4b3}
    </style>
    <!-- A: shaped mouse, premium and most literal -->
    <g id="mouse-a">
      <path d="M32 4 C15 4 10 17 10 33 L10 48 C10 65 20 76 32 76 C44 76 54 65 54 48 L54 33 C54 17 49 4 32 4Z" fill="#141210" stroke="#f0dec0" stroke-width="3"/>
      <path d="M32 6 C43 6 51 16 51 31 L51 34 L33 34 L33 6Z" fill="#d6b77e"/>
      <path d="M31 6 L31 34 L13 34 L13 31 C13 16 21 6 31 6Z" fill="#292018"/>
      <path d="M32 7 L32 35" stroke="#8e704a" stroke-width="2"/>
      <rect x="28" y="41" width="8" height="12" rx="4" fill="#e9cc91"/><rect x="30" y="43" width="4" height="6" rx="2" fill="#33271c"/>
      <path d="M16 62 Q32 69 48 62" fill="none" stroke="#5f4b33" stroke-width="2"/>
    </g>
    <!-- B: technical mouse, strong right-click panel -->
    <g id="mouse-b">
      <rect x="10" y="5" width="44" height="70" rx="21" fill="#11100f" stroke="#e5d0aa" stroke-width="3"/>
      <path d="M32 6 L32 35" stroke="#b89562" stroke-width="2"/>
      <path d="M34 8 H36 C45 8 51 16 51 26 V34 H34Z" fill="#e1bd79"/>
      <path d="M13 35 H51" stroke="#5d4930" stroke-width="2"/>
      <rect x="28" y="15" width="8" height="14" rx="4" fill="#271e16" stroke="#f4dca8" stroke-width="1"/>
      <path d="M20 55 H44" stroke="#3e3022" stroke-width="2"/><circle cx="32" cy="63" r="3" fill="#d6b77e"/>
    </g>
    <!-- C: click gesture, mouse and clean animated right-button cue -->
    <g id="mouse-c">
      <path d="M12 38 C12 17 21 5 32 5 C43 5 52 17 52 38 V54 C52 67 44 76 32 76 C20 76 12 67 12 54Z" fill="#151210" stroke="#f4e5ca" stroke-width="3"/>
      <path d="M33 8 C43 8 49 20 49 35 H33Z" fill="#d9b873"/>
      <path d="M32 8 V37" stroke="#7b603f" stroke-width="2"/><rect x="28" y="42" width="8" height="12" rx="4" fill="#efd19a"/>
      <path d="M57 15 Q68 25 57 35" fill="none" stroke="#e3c07e" stroke-width="3" stroke-linecap="round"/>
      <path d="M63 10 Q79 25 63 40" fill="none" stroke="#8f714a" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- D: compact glyph, closest to a game HUD icon -->
    <g id="mouse-d">
      <path d="M17 9 H47 L55 19 V57 L46 70 H18 L9 57 V19Z" fill="#151210" stroke="#ecd9b8" stroke-width="3"/>
      <path d="M33 10 H46 L52 19 V34 H33Z" fill="#d7b775"/>
      <path d="M32 10 V36" stroke="#886a45" stroke-width="2"/><path d="M12 37 H52" stroke="#604b30" stroke-width="2"/>
      <rect x="28" y="43" width="8" height="13" rx="3" fill="#e8c98e"/><path d="M22 63 H42" stroke="#493724" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1600" height="1000" fill="#0b0b0c"/>
  <text x="72" y="72" class="title">ПІКТОГРАМА ПРАВОЇ КНОПКИ — ВАРІАНТИ ДЛЯ PICKUP HUD</text>
  <text x="72" y="108" class="sub">Макет для вибору. У грі нічого не змінено і не опубліковано.</text>

  <!-- cards -->
  <g transform="translate(72 166)">
    <rect width="700" height="166" rx="4" fill="url(#panel)" stroke="#403523"/><rect width="700" height="3" fill="#d6b77e"/>
    <text x="28" y="38" class="tag">A — РЕКОМЕНДОВАНИЙ: ПРЕМІУМ-МИША</text>
    <rect x="28" y="60" width="54" height="54" rx="4" fill="#201a13"/><rect x="40" y="72" width="30" height="30" fill="#a77f40" opacity=".5"/>
    <text x="102" y="83" class="ui">Обтёсанная дубовая древесина</text><text x="102" y="111" class="action">ВЗЯТЬ ПРЕДМЕТ</text>
    <line x1="576" y1="44" x2="576" y2="133" stroke="#4c3d2b"/>
    <circle cx="638" cy="83" r="27" fill="#d6b77e" opacity=".06"/>
    <use href="#mouse-a" transform="translate(622 68) scale(.36)"/>
  </g>
  <g transform="translate(828 166)">
    <rect width="700" height="166" rx="4" fill="url(#panel)" stroke="#403523"/><rect width="700" height="3" fill="#d6b77e"/>
    <text x="28" y="38" class="tag">B — ТЕХНІЧНИЙ, СТРИМАНИЙ</text>
    <rect x="28" y="60" width="54" height="54" rx="4" fill="#201a13"/><rect x="40" y="72" width="30" height="30" fill="#a77f40" opacity=".5"/>
    <text x="102" y="83" class="ui">Обтёсанная дубовая древесина</text><text x="102" y="111" class="action">ВЗЯТЬ ПРЕДМЕТ</text>
    <line x1="576" y1="44" x2="576" y2="133" stroke="#4c3d2b"/>
    <circle cx="638" cy="83" r="27" fill="#d6b77e" opacity=".06"/>
    <use href="#mouse-b" transform="translate(622 68) scale(.36)"/>
  </g>
  <g transform="translate(72 380)">
    <rect width="700" height="166" rx="4" fill="url(#panel)" stroke="#403523"/><rect width="700" height="3" fill="#d6b77e"/>
    <text x="28" y="38" class="tag">C — ЖЕСТ НАТИСКАННЯ (ЖИВИЙ)</text>
    <rect x="28" y="60" width="54" height="54" rx="4" fill="#201a13"/><rect x="40" y="72" width="30" height="30" fill="#a77f40" opacity=".5"/>
    <text x="102" y="83" class="ui">Обтёсанная дубовая древесина</text><text x="102" y="111" class="action">ВЗЯТЬ ПРЕДМЕТ</text>
    <line x1="576" y1="44" x2="576" y2="133" stroke="#4c3d2b"/>
    <circle cx="638" cy="83" r="27" fill="#d6b77e" opacity=".06"/>
    <use href="#mouse-c" transform="translate(615 68) scale(.36)"/>
  </g>
  <g transform="translate(828 380)">
    <rect width="700" height="166" rx="4" fill="url(#panel)" stroke="#403523"/><rect width="700" height="3" fill="#d6b77e"/>
    <text x="28" y="38" class="tag">D — КОМПАКТНИЙ GAME-GLYPH</text>
    <rect x="28" y="60" width="54" height="54" rx="4" fill="#201a13"/><rect x="40" y="72" width="30" height="30" fill="#a77f40" opacity=".5"/>
    <text x="102" y="83" class="ui">Обтёсанная дубовая древесина</text><text x="102" y="111" class="action">ВЗЯТЬ ПРЕДМЕТ</text>
    <line x1="576" y1="44" x2="576" y2="133" stroke="#4c3d2b"/>
    <circle cx="638" cy="83" r="27" fill="#d6b77e" opacity=".06"/>
    <use href="#mouse-d" transform="translate(622 68) scale(.36)"/>
  </g>

  <!-- enlarged inspection row -->
  <text x="72" y="632" class="title">ЗБІЛЬШЕНО ДЛЯ ПЕРЕВІРКИ ФОРМИ</text>
  <g transform="translate(136 690)"><text x="-8" y="-22" class="tag">A</text><circle cx="64" cy="64" r="82" fill="#151210" stroke="#4f402b"/><use href="#mouse-a" transform="translate(31 18) scale(2.05)"/></g>
  <g transform="translate(510 690)"><text x="-8" y="-22" class="tag">B</text><circle cx="64" cy="64" r="82" fill="#151210" stroke="#4f402b"/><use href="#mouse-b" transform="translate(31 18) scale(2.05)"/></g>
  <g transform="translate(884 690)"><text x="-8" y="-22" class="tag">C</text><circle cx="64" cy="64" r="82" fill="#151210" stroke="#4f402b"/><use href="#mouse-c" transform="translate(26 18) scale(2.05)"/></g>
  <g transform="translate(1258 690)"><text x="-8" y="-22" class="tag">D</text><circle cx="64" cy="64" r="82" fill="#151210" stroke="#4f402b"/><use href="#mouse-d" transform="translate(31 18) scale(2.05)"/></g>
  <text x="72" y="934" class="small">Моя рекомендація: A — впізнавана форма миші, правий клік очевидний, без зайвих декоративних деталей. C — якщо хочеш більш виразну анімацію натискання.</text>
</svg>
