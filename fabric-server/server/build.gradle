                && surface.contains("ATOMIC_MOVE"):
                "Persisted surface film lost its budget, observer deduplication or atomic storage"
        assert !clientDecal.asFile.getText("UTF-8").contains("tickSurfaceFlow();"):
                "Wall flow must run once on the server, not independently per observer"
