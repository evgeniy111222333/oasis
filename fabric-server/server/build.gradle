tasks.register("verifyMicrovoxelFluidWiring") {
    group = "verification"
    description = "Checks voxel fluid plumbing: marker waterlogging, fill path, sim reconciliation."
    def serverMarker = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/MicrovoxelBlocks.java")
    def clientMarker = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/main/java/ua/rp/chat/microvoxel/MicrovoxelBlocks.java")
    def managerSource = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/MicrovoxelManager.java")
    def simSource = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/fluid/FluidSim.java")
    def blockStateMixin = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/mixin/microvoxel/BlockStateMicrovoxelMixin.java")
    def bootstrapSource = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/RPChat.java")
    def entityMixin = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/mixin/fluid/EntityFluidRefineMixin.java")
    def clientEntityMixin = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/client/java/ua/rp/chat/client/mixin/fluid/EntityFluidRefineMixin.java")
    def cameraMixin = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/client/java/ua/rp/chat/client/mixin/fluid/CameraFluidRefineMixin.java")
    def fluidRendererMixin = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/client/java/ua/rp/chat/client/mixin/fluid/FluidRendererMicrovoxelMixin.java")
    def sectionModel = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelSectionModel.java")
    def clientState = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelClientState.java")
    inputs.files(serverMarker, clientMarker, managerSource, simSource, bootstrapSource,
            entityMixin, clientEntityMixin, cameraMixin, fluidRendererMixin, sectionModel,
            clientState, blockStateMixin)
    doLast {
        def marker = serverMarker.asFile.getText("UTF-8")
        assert marker == clientMarker.asFile.getText("UTF-8"):
                "Server/client marker registries diverged"
        assert marker.contains("WATERLOGGED") && marker.contains("SimpleWaterloggedBlock")
                && marker.contains("getFluidState") && marker.contains("canPlaceLiquid"):
                "Marker must expose vanilla waterlogging with explicit-fill-only semantics"
        def manager = managerSource.asFile.getText("UTF-8")
        def bootstrap = bootstrapSource.asFile.getText("UTF-8")
        assert manager.contains("fillWithBucket") && manager.contains("WATER_EVAPORATES")
                && bootstrap.contains("WATER_BUCKET") && bootstrap.contains("Items.BUCKET"):
                "Bucket fills must go through the guarded basin path with nether evaporation"
        assert manager.contains("fillWithLavaBucket") && manager.contains("scoopLavaBucket")
                && manager.contains("quenchSurface") && manager.contains("LAVA_BUCKET")
                && bootstrap.contains("LAVA_BUCKET") && bootstrap.contains("DISPENSER_REGISTRY"):
                "Lava buckets, quenching and dispensers must share the guarded paths"
        def sim = simSource.asFile.getText("UTF-8")
        assert sim.contains("crustMaterial") && sim.contains("crustWithNeighbors")
                && sim.contains("voxelLavaHeight") && manager.contains("markerLightLevel"):
                "Thermodynamics and lava physics must stay wired to volume data"
        assert manager.contains("fluidSim.dropFluid") && manager.contains("LAVA.defaultBlockState"):
                "Scoops and restores must converge through sim cleanup with kind spills"
        assert sim.contains("equalizeWith") && sim.contains("adoptOrphanWaterlogged")
                && sim.contains("drainDownwardOpenings") && sim.contains("tuning.maxVolumesPerTick")
                && sim.contains("chunkLoaded(level,") && sim.contains("isProtected(key)"):
                "Fluid sim must equalize, adopt orphans and drain within budgets without loading chunks"
        assert bootstrap.contains("Items.BUCKET"):
                "Empty-bucket clicks must pass through to the vanilla scoop"
        // Precise fluid surfaces and dry-corner physics: levels ride FLUID_UPSERT/REMOVE,
        // vanilla full-cube water is suppressed for known volumes, entities and the camera
        // refine against exact 1/16 cells.
        def protocol = layout.projectDirectory.file(
                "src/main/java/ua/rp/chat/microvoxel/MicrovoxelProtocol.java").asFile.getText("UTF-8")
        def state = clientState.asFile.getText("UTF-8")
        assert protocol.contains("FLUID_UPSERT") && protocol.contains("FLUID_REMOVE")
                && protocol.contains("encodeLevels") && protocol.contains("decodeLevels")
                && protocol.contains("kindCode") && state.contains("kindCode"):
                "Fluid levels must travel in revision-guarded RLE packets with kind"
        assert sim.contains("syncFluid") && sim.contains("nearbyPlayers")
                && sim.contains("shouldIgnoreWater"):
                "Sim must throttle level sync and refine entity water reads"
        assert sim.contains("lateralFlow") && sim.contains("catchRain")
                && sim.contains("updateComparatorOutput") && sim.contains("comparatorSignal"):
                "Sim must relax surfaces laterally, catch rain and drive redstone tanks"
        assert entityMixin.asFile.getText("UTF-8").contains("isInWater")
                && entityMixin.asFile.getText("UTF-8").contains("getFluidHeight")
                && entityMixin.asFile.getText("UTF-8").contains("doWaterSplashEffect")
                && entityMixin.asFile.getText("UTF-8").contains("isInLava")
                && clientEntityMixin.asFile.getText("UTF-8").contains("isEyeInFluid")
                && clientEntityMixin.asFile.getText("UTF-8").contains("doWaterSplashEffect"):
                "Entity water reads and entry splashes must refine together, never partially"
        assert cameraMixin.asFile.getText("UTF-8").contains("FogType.NONE"):
                "Camera fog must lift on dry voxel cells"
        assert fluidRendererMixin.asFile.getText("UTF-8").contains("ci.cancel()")
                && sectionModel.asFile.getText("UTF-8").contains("emitFluidSurface")
                && sectionModel.asFile.getText("UTF-8").contains("SODIUM_PRESENT")
                && sectionModel.asFile.getText("UTF-8").contains("sodiumPreciseFluid")
                && sectionModel.asFile.getText("UTF-8").contains("tintSource"):
                "Vanilla full-cube water must yield to the precise biome-tinted surface mesh"
        assert state.contains("predictFluidUse") && state.contains("reconcileFluidPrediction")
                && state.contains("isDowsedMaterial") && manager.contains("isDowsedMaterial")
                && state.contains("predictLavaFill") && state.contains("abandonFluidPrediction"):
                "Fill previews must dowse torches exactly like the server confirmation"
        assert state.contains("fluid.lava()")
                && sectionModel.asFile.getText("UTF-8").contains("fluid.lava()"):
                "Lava must glow through light sealing and render outside the Sodium gate"
        assert blockStateMixin.asFile.getText("UTF-8").contains("getAnalogOutputSignal"):
                "Redstone tanks need the comparator hook on marker states"
        assert sim.contains("freezeSurface") && sim.contains("catchRain")
                && sim.contains("lateralFlow") && sim.contains("comparatorSignal"):
                "Sim must settle laterally, catch rain, frost crusts and drive comparators"
        assert bootstrap.contains("registerFluidDispenserBehavior")
                && bootstrap.contains("DISPENSER_REGISTRY")
                && manager.contains("stockWithBucket") && manager.contains("TROPICAL_FISH"):
                "Dispensers and mob buckets must stock basins through guarded paths"
    }
}

tasks.named("test") {
    failOnNoDiscoveredTests = false
}

tasks.register("verifyCarverParity") {
    group = "verification"
    description = "Fails when server/client Carver mirrors diverge (masks, estimates, payloads, items)."
    def pairs = [
            ["server/src/main/java/ua/rp/chat/carver/DraftMask.java",
             "client-mod-gradle/src/main/java/ua/rp/chat/carver/DraftMask.java"],

            ["server/src/main/java/ua/rp/chat/carver/DraftEstimate.java",
             "client-mod-gradle/src/main/java/ua/rp/chat/carver/DraftEstimate.java"],
            ["server/src/main/java/ua/rp/chat/carver/CarverProtocol.java",
             "client-mod-gradle/src/main/java/ua/rp/chat/carver/CarverProtocol.java"],
            ["server/src/main/java/ua/rp/chat/client/carver/CarverActionPayload.java",
             "client-mod-gradle/src/client/java/ua/rp/chat/client/carver/CarverActionPayload.java"],
            ["server/src/main/java/ua/rp/chat/client/carver/CarverSyncPayload.java",
             "client-mod-gradle/src/client/java/ua/rp/chat/client/carver/CarverSyncPayload.java"],
            ["server/src/main/java/ua/rp/chat/carver/CarverItems.java",
             "client-mod-gradle/src/main/java/ua/rp/chat/carver/CarverItems.java"],
            ["server/src/main/java/ua/rp/chat/carver/CarverStrikeAlign.java",
             "client-mod-gradle/src/main/java/ua/rp/chat/carver/CarverStrikeAlign.java"],
            ["server/src/main/java/ua/rp/chat/carver/CarverTrajectory.java",
             "client-mod-gradle/src/main/java/ua/rp/chat/carver/CarverTrajectory.java"],
    ]
    pairs.each { pair ->
        inputs.file(rootProject.layout.projectDirectory.file(pair[0]))
        inputs.file(rootProject.layout.projectDirectory.file(pair[1]))
    }
    doLast {
        pairs.each { pair ->
            def left = rootProject.layout.projectDirectory.file(pair[0]).asFile
            def right = rootProject.layout.projectDirectory.file(pair[1]).asFile
            assert left.isFile(): "Missing server mirror file: ${pair[0]}"
            assert right.isFile(): "Missing client mirror file: ${pair[1]}"
            assert java.util.Arrays.equals(left.readBytes(), right.readBytes()):
                    "Carver mirror divergence: ${pair[0]} != ${pair[1]}"
        }
    }
}

