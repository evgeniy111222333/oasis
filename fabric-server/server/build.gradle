tasks.register("verifyMicrovoxelHardening") {
    group = "verification"
    description = "Checks protection freezes fluid and blocks multi-volume brush/paste bypass; queue leases always release."
    def engine = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/edit/MicrovoxelEditEngine.java")
    def sim = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/fluid/FluidSim.java")
    def projection = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/MicrovoxelProjection.java")
    def manager = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/MicrovoxelManager.java")
    def store = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/fluid/FluidStore.java")
    inputs.files(engine, sim, projection, manager, store)
    doLast {
        def engineText = engine.asFile.getText("UTF-8")
        assert engineText.count("if (isProtected(key))") >= 2:
                "Brush and paste must each re-check protection on every touched volume"
        def simText = sim.asFile.getText("UTF-8")
        assert simText.contains("acceptsRain(") && simText.contains("isProtected(neighborKey)"):
                "Rain must gate on kind/protection and equalization must skip protected neighbours"
        assert simText.contains("if (isProtected(key)) return;"):
                "A protected volume must be frozen in the tick loop"
        def projectionText = projection.asFile.getText("UTF-8")
        assert projectionText.contains("catch (RuntimeException failure)")
                && projectionText.contains("finally")
                && projectionText.contains("reconcileQueue.complete(chunkKey)"):
                "Chunk reconcile leases must be released on every path without escaping the tick"
        def managerText = manager.asFile.getText("UTF-8")
        assert managerText.contains("MicrovoxelParentage.dominantMaterial(volume)"):
                "Marker sound and restore must use the dominant material"
        assert managerText.contains("if (isProtected(hit.key()))"):
                "restoreLookedAt must refuse protected volumes"
        def storeText = store.asFile.getText("UTF-8")
        assert storeText.contains("public synchronized boolean put(")
                && storeText.contains("Path backup = backupFile(file);")
                && storeText.contains("fluids.clear();")
                && storeText.contains("catch (IllegalArgumentException corruptLevels)"):
                "Fluid store must fail closed on the cap and never half-load a corrupt file"
    }
}

