tasks.register("syncServerDistribution", Copy) {
    dependsOn tasks.named("jar")
    group = "distribution"
    description = "Deploys the remapped Fabric server mod to the runnable server mods directory."
    from(tasks.named("jar").flatMap { it.archiveFile })
    into(rootProject.layout.projectDirectory.dir("mods"))
    rename { "eclipseserver-${project.version}.jar" }
    doFirst {
        def targetName = "eclipseserver-${project.version}.jar"
        rootProject.layout.projectDirectory.dir("mods").asFile.listFiles()?.findAll {
            it.name.startsWith("eclipseserver-") && it.name.endsWith(".jar")
                    && it.name != targetName
        }?.each { obsolete ->
            if (!obsolete.delete()) {
                throw new GradleException("Unable to remove obsolete server artifact ${obsolete}")
            }
        }
    }
}

tasks.named("build") {
    finalizedBy tasks.named("syncServerDistribution")
}
