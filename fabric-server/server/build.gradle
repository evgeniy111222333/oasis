tasks.register("verifyChunkLoadMarkerSafety") {
    group = "verification"
    description = "Prevents synchronous world/chunk access from returning to the C2ME CHUNK_LOAD callback."
    def managerSource = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/MicrovoxelManager.java")
    def projectionSource = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/MicrovoxelProjection.java")
    inputs.files(managerSource, projectionSource)
    doLast {
        def text = managerSource.asFile.getText("UTF-8")
        def start = text.indexOf("public void restoreMarkers(ServerLevel world, LevelChunk chunk)")
        assert start >= 0: "restoreMarkers chunk-load boundary is missing"
        assert !text.contains("private void restoreMarkersInLoadedChunks()"):
                "legacy restoreMarkersInLoadedChunks must be removed"
        // Scope the check to the restoreMarkers body itself (brace matching), so later
        // methods in the file (spills, fills, reconciliation) cannot trip it.
        def open = text.indexOf('{', start)
        assert open > start: "restoreMarkers body is missing"
        int depth = 0
        int close = -1
        for (int index = open; index < text.length(); index++) {
            char c = text.charAt(index)
            if (c == '{') depth++
            else if (c == '}') {
                depth--
                if (depth == 0) {
                    close = index
                    break
                }
            }
        }
        assert close > open: "restoreMarkers body is unterminated"
        def callback = text.substring(start, close + 1)
        assert callback.contains("scheduleReconcile"):
                "CHUNK_LOAD must only schedule whole-chunk reconciliation"
        assert !callback.contains("updateMarker("):
                "CHUNK_LOAD must not update blocks synchronously"
        assert !callback.contains("getBlockState(") && !callback.contains("setBlock("):
                "CHUNK_LOAD must not re-enter chunk access"
        def projection = projectionSource.asFile.getText("UTF-8")
        assert projection.contains("MAX_RECONCILES_PER_TICK = 2"):
                "Deferred reconciliation must remain bounded per tick"
        assert projection.contains("reconcileQueue.poll"):
                "Deferred reconciliation must be drained from a bounded queue"
    }
}

tasks.register("verifyMicrovoxelNativeMarker") {
    group = "verification"
    description = "Checks the paired native marker registry and fail-closed delta resynchronization."
    def managerSource = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/MicrovoxelManager.java")
    def serverMarker = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/MicrovoxelBlocks.java")
    def clientMarker = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/main/java/ua/rp/chat/microvoxel/MicrovoxelBlocks.java")
    def clientState = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelClientState.java")
    def clientRenderer = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelClientRenderer.java")
    def sectionModel = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelSectionModel.java")
    def interaction = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelInteractionController.java")
    def gameModeMixin = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/client/java/ua/rp/chat/client/mixin/microvoxel/MultiPlayerGameModeMixin.java")
    def serverBlockStateMixin = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/mixin/microvoxel/BlockStateMicrovoxelMixin.java")
    def protocolSource = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/MicrovoxelProtocol.java")
    def bootstrapSource = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/RPChat.java")
    def authSource = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/auth/AuthManager.java")
    inputs.files(managerSource, serverMarker, clientMarker, clientState, clientRenderer, sectionModel,
            interaction, gameModeMixin, serverBlockStateMixin, protocolSource, bootstrapSource,
            authSource)
    doLast {
        def manager = managerSource.asFile.getText("UTF-8")
        def state = clientState.asFile.getText("UTF-8")
        def renderer = clientRenderer.asFile.getText("UTF-8")
        def section = sectionModel.asFile.getText("UTF-8")
        assert serverMarker.asFile.getText("UTF-8") == clientMarker.asFile.getText("UTF-8"):
                "Server/client native microvoxel marker registries diverged"
        assert manager.contains("return MicrovoxelBlocks.markerState(")
                && manager.contains("markerLightLevel(volume, kind)")
                && serverMarker.asFile.getText("UTF-8").contains("SOUND_PROFILE")
                && serverMarker.asFile.getText("UTF-8").contains("WATERLOGGED"):
                "Microvoxel volumes still use a vanilla placeholder marker"
        assert state.contains('requestVolumeResync(immutable, "delta without base volume')
                && state.contains('MicrovoxelRevision.isImmediateNext'):
                "Missing or out-of-order deltas must request an authoritative targeted volume"
        assert renderer.contains("MicrovoxelBlocks.isMarker(state)"):
                "The native marker is registered but rejected by the client renderer"
        assert section.contains("ModelLoadingPlugin.register")
                && section.contains("extends WrapperBlockStateModel")
                && state.contains("setSectionDirty"):
                "Microvoxel geometry must compile into bounded persistent terrain section buffers"
        assert state.contains("oldCached.updateVolume(volume)")
                && state.contains("currentCenter.mesh = mesh")
                && !state.contains("oldCached == null ? null : oldCached.getShape()"):
                "Continuous edits must coalesce shape work and publish intermediate meshes"
        assert interaction.asFile.getText("UTF-8").contains(
                "Always raycast the predicted"):
                "Continuous attack must not resend the previous tick's stale target"
        assert gameModeMixin.asFile.getText("UTF-8").contains(
                "MicrovoxelInteractionController.editing() && MicrovoxelClientState.get(pos) != null"):
                "Native survival mining must remain enabled outside microvoxel edit mode"
        def miningMixin = serverBlockStateMixin.asFile.getText("UTF-8")
        assert miningMixin.contains("eclipse\$microvoxelDestroyProgress")
                && miningMixin.contains("parentBlockState"):
                "Server mining speed must delegate to the parent material"
        assert manager.contains("player.hasCorrectToolForDrops(parentState)")
                && !manager.contains("getRequiredBreakTimeMs"):
                "Microvoxel harvest rules must use vanilla parent-material tool semantics"
        def protocol = protocolSource.asFile.getText("UTF-8")
        assert protocol.contains("SNAPSHOT_BEGIN")
                && protocol.contains("SNAPSHOT_END")
                && protocol.contains("ACTION_SNAPSHOT_ACK")
                && state.contains("snapshotConfirmed")
                && state.contains("READY_RETRY_TICKS")
                && manager.contains("retryUnacknowledgedSnapshots"):
                "Login/restart snapshots must remain acknowledged and retryable"
        assert section.contains("noteMissingVolume(pos)")
                && state.contains("processMissingMarkers()")
                && manager.contains("reconcileOrphanMarker"):
                "A rendered marker without a volume must self-heal or be reconciled"
        assert bootstrapSource.asFile.getText("UTF-8").contains(
                "MicrovoxelProtocol.isSynchronizationAction(payload.action())")
                && authSource.asFile.getText("UTF-8").contains(
                "onAuthenticationComplete(player)"):
                "RP authentication must not swallow microvoxel synchronization"
        assert manager.contains('resolve("rpchat").resolve("microvoxels")')
                && manager.contains("LEGACY_MIGRATION_COMPLETE")
                && manager.contains("legacyStore.snapshot().entries()"):
                "Microvoxel regions must live with the world and preserve legacy migration"
        assert manager.contains("fillWithBucket")
                && manager.contains("fluidStore")
                && manager.contains("markerState(volume, fluidKind(key))"):
                "Fluid volumes must be fillable, persisted and projected with their flag"
    }
}

