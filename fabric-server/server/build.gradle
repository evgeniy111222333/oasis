tasks.register("verifyMixinConfigSync") {
    group = "verification"
    description = "Checks every mixin JSON entry resolves to a @Mixin source and vice versa."
    def mixinJson = layout.projectDirectory.file("src/main/resources/eclipseserver.mixins.json")
    def mixinRoot = layout.projectDirectory.dir("src/main/java/ua/rp/chat/mixin")
    inputs.file(mixinJson)
    inputs.dir(mixinRoot)
    doLast {
        def parsed = new groovy.json.JsonSlurper().parse(mixinJson.asFile)
        def listed = (parsed.mixins as List).collect { it.toString() } as Set
        assert !listed.isEmpty(): "Server mixin configuration lists no mixins"
        listed.each { name ->
            def source = mixinRoot.file(
                    name.replace(".", File.separator) + ".java").asFile
            assert source.isFile(): "Mixin JSON lists missing source ${name}"
            assert source.getText("UTF-8").contains("@Mixin("):
                    "${name} is listed as a mixin but carries no @Mixin annotation"
        }
        mixinRoot.asFile.eachFileRecurse { file ->
            if (file.name.endsWith(".java")) {
                def relative = mixinRoot.asFile.toPath().relativize(file.toPath()).toString()
                        .replace(File.separator, ".").replace(".java", "")
                assert listed.contains(relative):
                        "${relative} is a mixin source but is not listed in the JSON"
            }
        }
        // The deprecated hurtOrSimulate bridge must never be *called* (redirect target
        // strings like "Entity;hurtOrSimulate(" are fine and required); damage goes
        // through hurtServer/hurtClient directly.
        mixinRoot.asFile.eachFileRecurse { file ->
            if (file.name.endsWith(".java")) {
                assert !(file.getText("UTF-8") =~ /\.hurtOrSimulate\(/):
                        "${file.name} calls the deprecated hurtOrSimulate bridge"
            }
        }
        println "Mixin config sync: ${listed.size()} server mixins listed and present"
    }
}

tasks.register("verifyMicrovoxelProtocolParity") {
    group = "verification"
    description = "Checks the wire contract is single-sourced in common/ and consumed by both sides."
    def wireSource = rootProject.layout.projectDirectory.file(
            "common/src/main/java/ua/rp/chat/microvoxel/MicrovoxelWire.java")
    def protocolSource = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/microvoxel/MicrovoxelProtocol.java")
    def clientState = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/client/java/ua/rp/chat/client/microvoxel/MicrovoxelClientState.java")
    def batchPayload = rootProject.layout.projectDirectory.file(
            "common/src/main/java/ua/rp/chat/client/microvoxel/MicrovoxelBatchPayload.java")
    def bootstrapSource = layout.projectDirectory.file(
            "src/main/java/ua/rp/chat/RPChat.java")
    def clientBootstrap = rootProject.layout.projectDirectory.file(
            "client-mod-gradle/src/client/java/ua/rp/chat/client/EclipseClientMod.java")
    inputs.files(wireSource, protocolSource, clientState, batchPayload, bootstrapSource, clientBootstrap)
    doLast {
        def wire = wireSource.asFile.getText("UTF-8")
        def protocol = protocolSource.asFile.getText("UTF-8")
        def state = clientState.asFile.getText("UTF-8")
        // The shared contract owns the frame and the codes.
        assert wire.contains("public static final int MAJOR =")
                && wire.contains("public static final int MINOR =")
                && wire.contains("public static final int MAGIC =")
                && wire.contains("public static byte[] frame(")
                && wire.contains("public static Frame readFrame("):
                "The shared wire contract must define the frame, magic and version"
        // Server builders and client decoder both consume it, never a copied constant table.
        assert protocol.contains("MicrovoxelWire.MAGIC") && protocol.contains("MicrovoxelWire.frame("):
                "Server builders must use the shared frame"
        assert state.contains("MicrovoxelWire.readFrame") && state.contains("MicrovoxelWire.MINE_STAGE")
                && state.contains("MicrovoxelWire.CLEAR") && state.contains("MicrovoxelWire.ACTION_HELLO"):
                "Client must consume the shared contract instead of a private mirror"
        assert !state.contains("private static final int UPSERT = 2"):
                "Client must not re-declare wire message codes"
        assert batchPayload.asFile.getText("UTF-8").contains("MAX_ENTRIES = 16"):
                "Batch packet cap is missing"
        def bootstrap = bootstrapSource.asFile.getText("UTF-8")
        assert bootstrap.contains("MicrovoxelBatchPayload.TYPE")
                && bootstrap.contains("MicrovoxelBatchPayload.CODEC"):
                "Batch payload must be registered on the server"
        def clientInit = clientBootstrap.asFile.getText("UTF-8")
        assert clientInit.contains("MicrovoxelBatchPayload.TYPE")
                && clientInit.contains("MicrovoxelBatchPayload.CODEC"):
                "Batch payload must be registered on the client"
    }
}

tasks.register("verifySharedSourceUniqueness") {
    group = "verification"
    description = "Fails when a file under common/ is reintroduced as a copy on either side."
    def commonDir = rootProject.layout.projectDirectory.dir("common/src/main/java")
    def serverDir = layout.projectDirectory.dir("src/main/java")
    def clientMainDir = rootProject.layout.projectDirectory.dir("client-mod-gradle/src/main/java")
    def clientEnvDir = rootProject.layout.projectDirectory.dir("client-mod-gradle/src/client/java")
    inputs.dir(commonDir)
    doLast {
        def relative = { File root, File file -> root.toPath().relativize(file.toPath()).toString() }
        def serverSet = [] as Set
        serverDir.asFile.eachFileRecurse { if (it.name.endsWith(".java")) serverSet.add(relative(serverDir.asFile, it)) }
        def clientMainSet = [] as Set
        clientMainDir.asFile.eachFileRecurse { if (it.name.endsWith(".java")) clientMainSet.add(relative(clientMainDir.asFile, it)) }
        def clientEnvSet = [] as Set
        clientEnvDir.asFile.eachFileRecurse { if (it.name.endsWith(".java")) clientEnvSet.add(relative(clientEnvDir.asFile, it)) }
        def copies = []
        commonDir.asFile.eachFileRecurse { file ->
            if (!file.name.endsWith(".java")) return
            def key = relative(commonDir.asFile, file)
            if (serverSet.contains(key) || clientMainSet.contains(key) || clientEnvSet.contains(key)) {
                copies.add(key)
            }
        }
        assert copies.isEmpty():
                "Shared sources must live only in common/, found copies: " + copies
    }
}

tasks.register("verifySharedBoundary") {
    group = "verification"
    description = "Fails when shared common/ code imports a server-only or client-only package."
    def commonDir = rootProject.layout.projectDirectory.dir("common/src/main/java")
    inputs.dir(commonDir)
    doLast {
        def forbidden = [
                "import net.minecraft.server.",
                "import net.minecraft.client.",
                "import ua.rp.chat.client.microvoxel.MicrovoxelClientState",
                "import ua.rp.chat.microvoxel.sync.",
                "import ua.rp.chat.microvoxel.persistence.",
                "import ua.rp.chat.microvoxel.edit.",
                "import ua.rp.chat.microvoxel.fluid.",
                "import ua.rp.chat.microvoxel.collision.",
                "import ua.rp.chat.microvoxel.econ.",
                "import ua.rp.chat.microvoxel.environment.",
                "import ua.rp.chat.microvoxel.mining.",
        ]
        def violations = []
        commonDir.asFile.eachFileRecurse { file ->
            if (!file.name.endsWith(".java")) return
            def text = file.getText("UTF-8")
            forbidden.each { marker ->
                if (text.contains(marker)) violations.add("${file.name}: ${marker}")
            }
        }
        assert violations.isEmpty():
                "Shared common/ code must not depend on a side-only package: " + violations
    }
}

