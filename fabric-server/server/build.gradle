tasks.register("verifyMixinConfigSync") {
    group = "verification"
    description = "Checks every mixin JSON entry resolves to a @Mixin source and vice versa."
    def mixinJson = layout.projectDirectory.file("src/main/resources/eclipseserver.mixins.json")
    def mixinRoot = layout.projectDirectory.dir("src/main/java/ua/rp/chat/mixin")
    inputs.file(mixinJson)
    inputs.dir(mixinRoot)
    doLast {
        def parsed = new groovy.json.JsonSlurper().parse(mixinJson.asFile)
        def listed = (parsed.mixins as List).collect { it.toString() } as Set
        assert !listed.isEmpty(): "Server mixin configuration lists no mixins"
        listed.each { name ->
            def source = mixinRoot.file(
                    name.replace(".", File.separator) + ".java").asFile
            assert source.isFile(): "Mixin JSON lists missing source ${name}"
            assert source.getText("UTF-8").contains("@Mixin("):
                    "${name} is listed as a mixin but carries no @Mixin annotation"
        }
        mixinRoot.asFile.eachFileRecurse { file ->
            if (file.name.endsWith(".java")) {
                def relative = mixinRoot.asFile.toPath().relativize(file.toPath()).toString()
                        .replace(File.separator, ".").replace(".java", "")
                assert listed.contains(relative):
                        "${relative} is a mixin source but is not listed in the JSON"
            }
        }
        // The deprecated hurtOrSimulate bridge must never be *called* (redirect target
        // strings like "Entity;hurtOrSimulate(" are fine and required); damage goes
        // through hurtServer/hurtClient directly.
        mixinRoot.asFile.eachFileRecurse { file ->
            if (file.name.endsWith(".java")) {
                assert !(file.getText("UTF-8") =~ /\.hurtOrSimulate\(/):
                        "${file.name} calls the deprecated hurtOrSimulate bridge"
            }
        }
        println "Mixin config sync: ${listed.size()} server mixins listed and present"
    }
}

tasks.register("verifyMicrovoxelProtocolParity") {
    group = "verification"
