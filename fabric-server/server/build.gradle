plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

// Single source of truth for code shared with the client module (protocol, volume model,
// codecs, shared gameplay math). Compiled by each side; never copied.
def commonSources = rootProject.file('common/src/main/java')
sourceSets.main.java.srcDirs += commonSources
sourceSets.test.java.srcDirs += rootProject.file('common/src/test/java')

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    
    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Minecraft does not ship a JDBC driver. Keep auth.db self-contained in the
    // Fabric mod instead of accidentally relying on Paper's old libraries folder.
    implementation include("org.xerial:sqlite-jdbc:3.49.1.0")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs << "-Xmaxerrs" << "5000" << "-Xlint:deprecation"
}

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion
    exclude "plugin.yml"
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

