<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse Roleplay Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="bg_village.jpg?v=5">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <main class="auth-shell">
        <section class="scene-panel" aria-label="Персонаж">
            <div class="ambient-grid"></div>
            <div class="horizon-glow"></div>
            <div class="sand-trace trace-a"></div>
            <div class="sand-trace trace-b"></div>

            <header class="brand-mark">
                <span class="brand-kicker">Eclipse Roleplay</span>
                <h1 id="sceneTitle">Вход в мир</h1>
                <p id="sceneLead">Персонаж ожидает подтверждения владельца.</p>
            </header>

            <div class="scene-stats" aria-hidden="true">
                <span>RP-профиль</span>
                <span>Сессия защищена</span>
            </div>

            <div class="character-stage">
                <div class="stage-arch"></div>
                <div class="stage-light"></div>
                <div class="skin-frame" aria-label="Облик персонажа">
                    <div id="skinModel" class="skin-model skin-model-loading">
                        <span class="skin-part skin-head"></span>
                        <span class="skin-part skin-hat"></span>
                        <span class="skin-part skin-body"></span>
                        <span class="skin-part skin-jacket"></span>
                        <span class="skin-part skin-arm skin-arm-right"></span>
                        <span class="skin-part skin-arm skin-arm-left"></span>
                        <span class="skin-part skin-sleeve skin-sleeve-right"></span>
                        <span class="skin-part skin-sleeve skin-sleeve-left"></span>
                        <span class="skin-part skin-leg skin-leg-right"></span>
                        <span class="skin-part skin-leg skin-leg-left"></span>
                        <span class="skin-part skin-pants skin-pants-right"></span>
                        <span class="skin-part skin-pants skin-pants-left"></span>
                    </div>
                </div>
                <div class="stand-shadow"></div>
                <div class="stand-base">
                    <span></span>
                </div>
                <div class="plate">
                    <div>
                        <span id="playerName">Игрок</span>
                        <small id="playerMode">Проверка профиля</small>
                    </div>
                    <strong id="playerSeal">ID</strong>
                </div>
            </div>
        </section>

        <section class="panel-wrap" aria-label="Авторизация">
            <div class="auth-panel">
                <header class="panel-head">
                    <span class="secure-dot"></span>
                    <div>
                        <p>Защищенная сессия</p>
                        <h2 id="panelTitle">Вход</h2>
                    </div>
                </header>

                <div class="tabs" id="tabsNav">
                    <button class="tab-btn active" type="button" data-tab="login">Вход</button>
                    <button class="tab-btn" type="button" data-tab="register">Регистрация</button>
                </div>

                <form id="loginForm" class="auth-form active" novalidate>
                    <label>
                        <span>Логин аккаунта</span>
                        <input id="loginName" type="text" autocomplete="username" placeholder="Ваш логин">
                    </label>

                    <label>
                        <span>Пароль</span>
                        <div class="password-field">
                            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Введите пароль">
                            <button type="button" class="ghost-btn" data-toggle="loginPassword">Показать</button>
                        </div>
                    </label>

                    <div class="row-line">
                        <label class="check-line">
                            <input id="rememberMe" type="checkbox" checked>
                            <span>Запомнить логин и пароль</span>
                        </label>
                        <button type="button" class="link-btn" data-tab="recovery">Восстановить</button>
                    </div>

                    <div id="loginError" class="alert error"></div>
                    <button id="loginBtn" class="submit-btn" type="submit">
                        <span>Войти в мир</span>
                    </button>
                </form>

                <form id="registerForm" class="auth-form" novalidate>
                    <label>
                        <span>Логин аккаунта</span>
                        <input id="regLogin" type="text" autocomplete="username" placeholder="Например: eclipse_player">
                    </label>

                    <label>
                        <span>Имя персонажа</span>
                        <input id="regRpName" type="text" autocomplete="name" placeholder="Например: Иван Петров">
                    </label>

                    <div class="appearance-field">
                        <div class="field-title">
                            <span>Облик персонажа</span>
                            <small>PNG 64x64 или 64x32</small>
                        </div>
                        <div class="appearance-actions">
                            <label class="upload-btn">
                                <input id="appearanceFile" type="file" accept="image/png">
                                <span id="appearanceFileLabel">Загрузить образ</span>
                            </label>
                            <div class="model-choice" role="group" aria-label="Телосложение">
                                <label>
                                    <input type="radio" name="appearanceModel" value="classic" checked>
                                    <span>Обычный</span>
                                </label>
                                <label>
                                    <input type="radio" name="appearanceModel" value="slim">
                                    <span>Стройный</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <label>
                        <span>Email</span>
                        <input id="regEmail" type="email" autocomplete="email" placeholder="name@example.com">
                    </label>

                    <label>
                        <span>Пароль</span>
                        <div class="password-field">
                            <input id="regPassword" type="password" autocomplete="new-password" placeholder="Минимум 6 символов">
                            <button type="button" class="ghost-btn" data-toggle="regPassword">Показать</button>
                        </div>
                    </label>

                    <label>
                        <span>Повторите пароль</span>
                        <div class="password-field">
                            <input id="regConfirmPassword" type="password" autocomplete="new-password" placeholder="Еще раз пароль">
                            <button type="button" class="ghost-btn" data-toggle="regConfirmPassword">Показать</button>
                        </div>
                    </label>

                    <label class="check-line terms-line">
                        <input id="agreeTerms" type="checkbox">
                        <span>Я принимаю правила Eclipse Roleplay.</span>
                    </label>

                    <div id="registerError" class="alert error"></div>
                    <button id="registerBtn" class="submit-btn" type="submit">
                        <span>Создать персонажа</span>
                    </button>
                </form>

                <form id="recoveryForm" class="auth-form" novalidate>
                    <button type="button" class="link-btn back" data-tab="login">Назад ко входу</button>
                    <div class="recovery-copy">
                        <h3>Восстановление доступа</h3>
                        <p>Укажите email, привязанный к аккаунту.</p>
                    </div>

                    <label>
                        <span>Email</span>
                        <input id="recoveryEmail" type="email" autocomplete="email" placeholder="name@example.com">
                    </label>

                    <div id="recoveryError" class="alert error"></div>
                    <div id="recoverySuccess" class="alert success"></div>
                    <button id="recoveryBtn" class="submit-btn" type="submit">
                        <span>Отправить код</span>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <div class="success-screen" id="successScreen">
        <div class="success-card">
            <div class="success-ring"></div>
            <h2 id="successTitle">Готово</h2>
            <p id="successMessage">Возвращаем вас в игру.</p>
        </div>
    </div>

    <script src="app.js?v=5"></script>
</body>
</html>
