name: RPChat
version: 1.4.5
main: ua.rp.chat.RPChat
api-version: '1.21'
author: Antigravity
description: Custom Roleplay Chat system with local chat, RP commands, cinematic auth, and plugin reloader.
commands:
  login:
    description: Log in to the server.
    usage: /login <password>
  register:
    description: Register a new account.
    usage: /register <password> <password>
  l:
    description: Short alias for /login.
    usage: /l <password>
  skin:
    description: Opens the secure character appearance studio.
    usage: /skin
  me:
    description: Describes character action.
    usage: /me <action>
  do:
    description: Describes state of environment.
    usage: /do <state>
  try:
    description: Probabilistic action attempt.
    usage: /try <action>
  todo:
    description: Character speech with action.
    usage: /todo <speech> * <action>
  b:
    description: Local Out-Of-Character chat.
    usage: /b <message>
  say:
    description: Normal local speech.
    usage: /say <message>
  w:
    description: Local whisper.
    usage: /w <message>
  whisper:
    description: Local whisper.
    usage: /whisper <message>
  s:
    description: Local shout.
    usage: /s <message>
  shout:
    description: Local shout.
    usage: /shout <message>
  rpreload:
    description: Hot-reloads a server plugin from disk.
    usage: /rpreload [plugin_name]
    permission: rpchat.admin
  rpcrun:
    description: Executes an RP command on behalf of a target player.
    usage: /rpcrun [player] [me/do/try/todo/b] [args...]
    permission: rpchat.admin
  rpdemo:
    description: Shows interactive previews of the 10 proposed chat styles.
    usage: /rpdemo [1-10]
  rpcombatdebug:
    description: Debug combat profiles and damage calculation.
    usage: /rpcombatdebug
    permission: rpchat.admin
  microvoxel:
    description: Управление микровоксельными блоками.
    usage: /microvoxel [convert|restore|status]
    permission: rpchat.microvoxels.edit
permissions:
  rpchat.microvoxels.edit:
    description: Разрешает преобразование и редактирование микровоксельных блоков.
    default: op

