# ==========================================
#               RPChat Config
# ==========================================
# Глобальний стиль чату (від 1 до 10)
# Ви можете змінити цей параметр командою /rpdemo select [1-10] прямо в грі.
# 
# 1. Aether Minimalist (Чистий пастельний)
# 2. Chamber Theatre (Художній літературний)
# 3. Nordic Aurora (Контрастний синьо-зелений)
# 4. Sakura Blossom (Ніжна сакура)
# 5. Cyber Glow (Неоновий кіберпанк)
# 6. Mono Noir (Чорно-білий темний)
# 7. Sunset Boulevard (Оксамитовий вечірній)
# 8. Earthy Forest (Лісові деревні тони)
# 9. Vogue Elegant (Вишуканий висококонтрастний)
# 10. Echo Whisper (Зоряний космічний)
active-style: 1

# ==========================================
#             Web Auth Settings
# ==========================================
web:
  # Port for the embedded HTTP server (Must be open on firewall)
  port: 25580
  # Base URL sent to client auth overlay. Use the LAN/public address players can reach.
  url: "http://192.168.0.241:25580"

# ==========================================
#             Auth Session Settings
# ==========================================
auth:
  # Legacy behavior: skip the auth window when the player's IP matches the last login.
  # Keep disabled for RP servers; "remember me" should only prefill the form.
  auto-login-by-ip: false
