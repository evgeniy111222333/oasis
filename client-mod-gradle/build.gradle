	inputs.file(source)
	doLast {
		def text = source.asFile.getText("UTF-8")
		assert text.contains("model.body.translateAndRotate(poseStack);"):
				"Holster must inherit PlayerModel.body before its local attachment offset is applied"
		assert text.contains("HeavyHammerHolsterLayout.bodyAttachment(latchClosed)"):
				"Holster must use the bounded layout attachment rather than a raw root offset"
	}
}

