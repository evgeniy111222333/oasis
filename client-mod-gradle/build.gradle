tasks.register("verifyHeavyHammerHolsterAssets") {
	group = "verification"
	description = "Проверяет модель, предметное описание, 128px-текстуры и зазор петель портупеи."
	def modelFile = layout.projectDirectory.file("src/main/resources/assets/eclipseclient/models/item/heavy_hammer_holster.json")
	def itemFile = layout.projectDirectory.file("src/main/resources/assets/eclipseclient/items/heavy_hammer_holster.json")
	def textureFile = layout.projectDirectory.file("src/main/resources/assets/eclipseclient/textures/item/heavy_hammer_holster.png")
	def normalFile = layout.projectDirectory.file("src/main/resources/assets/eclipseclient/textures/item/heavy_hammer_holster_n.png")
	def specFile = layout.projectDirectory.file("src/main/resources/assets/eclipseclient/textures/item/heavy_hammer_holster_s.png")
	inputs.files(modelFile, itemFile, textureFile, normalFile, specFile)
	doLast {
		def model = new JsonSlurper().parse(modelFile.asFile)
		def item = new JsonSlurper().parse(itemFile.asFile)
		def elements = model.elements.collectEntries { [(it.name): it] }
		assert model.texture_size == [128, 128]: "Атлас портупеи должен иметь логическое разрешение 128x128"
		assert model.elements.size() >= 80: "Детализированная портупея потеряла геометрию: ${model.elements.size()} кубоидов"
		assert item.model.model == "eclipseclient:item/heavy_hammer_holster": "Предмет ссылается не на ту модель"
		assert elements.frog_top_left && elements.frog_top_right && elements.frog_top_front && elements.frog_top_back:
				"В модели отсутствует несущая верхняя петля"
		def openingX = (elements.frog_top_right.from[0] as Number).doubleValue()
				- (elements.frog_top_left.to[0] as Number).doubleValue()
		def openingZ = (elements.frog_top_back.from[2] as Number).doubleValue()
				- (elements.frog_top_front.to[2] as Number).doubleValue()
		assert openingX >= 2.20d && openingZ >= 1.90d:
				"Древко 1.14px не проходит через рабочее окно петли ${openingX}x${openingZ}"
		[textureFile, normalFile, specFile].each { file ->
			def image = javax.imageio.ImageIO.read(file.asFile)
			assert image != null && image.width == 128 && image.height == 128:
					"Текстура ${file.asFile.name} должна быть валидным PNG 128x128"
		}
		println "Heavy hammer holster assets: model, item, textures and frog clearance are valid"
	}
}

