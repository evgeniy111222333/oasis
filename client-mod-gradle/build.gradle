tasks.register("verifyHeavyHammerModelBounds") {
	group = "verification"
	description = "Проверяет допустимые координаты кубоидов и наличие текстуры тяжёлого молота."
	def modelFile = layout.projectDirectory.file("src/main/resources/assets/eclipseclient/models/item/heavy_hammer.json")
	def textureFile = layout.projectDirectory.file("src/main/resources/assets/eclipseclient/textures/item/heavy_hammer.png")
	inputs.files(modelFile, textureFile)

	doLast {
		def model = new JsonSlurper().parse(modelFile.asFile)
		def elements = model.elements.collectEntries { [(it.name): it] }
		def shaftScale = (model.display.thirdperson_righthand.scale[1] as Number).doubleValue()
		def gripPivot = 8.0d
		def buttToMainGrip = (gripPivot - (elements.ash_haft.from[1] as Number).doubleValue()) * shaftScale
		def mainGripToSocket = ((elements.socket.from[1] as Number).doubleValue() - gripPivot) * shaftScale
		def headCenter = (((elements.head_core.from[1] as Number).doubleValue()
				+ (elements.head_core.to[1] as Number).doubleValue()) * 0.5d - gripPivot) * shaftScale
		assert Math.abs(buttToMainGrip - 4.25d) < 0.02d:
				"Под нижней кистью должно оставаться 4.25 px рукояти от центра ладони: ${buttToMainGrip}"
		assert Math.abs(mainGripToSocket - 16.7d) < 0.02d:
				"Рабочая зона рукояти должна оставлять запас между верхней кистью и втулкой: ${mainGripToSocket}"
		assert Math.abs(headCenter - 19.835d) < 0.02d:
				"Визуальный центр бойка должен совпадать с процедурной длиной: ${headCenter}"
		assert model.elements && !model.elements.isEmpty(): "Модель тяжёлого молота не содержит кубоидов"
		model.elements.each { element ->
			["from", "to"].each { key ->
				element[key].eachWithIndex { coordinate, axis ->
					assert coordinate >= -16.0 && coordinate <= 32.0:
						"${element.name} ${key}[${axis}]=${coordinate} выходит за пределы Minecraft [-16, 32]"
				}
			}
		}
		assert textureFile.asFile.length() > 0: "Текстура тяжёлого молота отсутствует или пуста"
		println "Heavy hammer model bounds: all cuboids are valid and texture is present"
	}
}

