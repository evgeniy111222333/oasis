tasks.register("verifyHeavyHammerBootstrapSafety") {
	group = "verification"
	description = "Запрещает создавать ItemStack подвеса в статическом инициализаторе до привязки компонентов Minecraft."
	def source = layout.projectDirectory.file("src/client/java/ua/rp/chat/client/heavyhammer/HeavyHammerCarryRenderLayer.java")
	inputs.file(source)
	doLast {
		def text = source.asFile.getText("UTF-8")
		assert !text.contains("static final ItemStack"):
				"ItemStack подвеса снова создаётся до привязки компонентов Minecraft"
		assert text.contains("if (holsterStack == null) holsterStack = createHolsterStack();"):
				"Ленивая инициализация подвеса отсутствует"
	}
}

tasks.register("verifyHeavyHammerHolsterBodyAttachment") {
	group = "verification"
